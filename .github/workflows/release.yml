name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Package artifacts
        run: |
          mkdir -p release
          cp bin/lingoflow.mjs "release/lingoflow-${{ steps.meta.outputs.version }}.mjs"
          cp bin/lingoflow.mjs release/lingoflow.mjs
          npm pack --pack-destination release
          cd release
          shasum -a 256 * > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: LingoFlow ${{ steps.meta.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            release/*.mjs
            release/*.tgz
            release/checksums.txt
