name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- CLI (Node) ----------
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # ---------- Android app ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Package artifacts
        run: |
          mkdir -p release
          cp bin/lingoflow.mjs "release/lingoflow-${{ steps.meta.outputs.version }}.mjs"
          cp bin/lingoflow.mjs release/lingoflow.mjs
          npm pack --pack-destination release
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release/lingoflow-android-${{ steps.meta.outputs.version }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "release/lingoflow-android-${{ steps.meta.outputs.version }}-debug.apk"
          cd release
          shasum -a 256 * > checksums.txt
          ls -la

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: LingoFlow ${{ steps.meta.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            release/*.mjs
            release/*.tgz
            release/*.apk
            release/checksums.txt
