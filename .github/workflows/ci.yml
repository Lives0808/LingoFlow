name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the CLI
        run: node bin/lingoflow.mjs --version && node bin/lingoflow.mjs --help

  demo:
    name: Demo project end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run the full pipeline on examples/demo-app
        working-directory: examples/demo-app
        run: |
          node ../../bin/lingoflow.mjs doctor
          node ../../bin/lingoflow.mjs scan
          node ../../bin/lingoflow.mjs sync --dry-run
          node ../../bin/lingoflow.mjs sync
          node ../../bin/lingoflow.mjs report
      - name: Validate the generated catalogs
        working-directory: examples/demo-app
        run: |
          node -e "const z=require('./locales/zh-CN.json'); if(!z.dialog.deleteTitle.includes('{name}')) { throw new Error('placeholder lost'); }"
          test -f .lingoflow/report/index.html
          test -f .lingoflow/report/report.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lingoflow-report
          path: examples/demo-app/.lingoflow/report/
